<!DOCTYPE html>
<html>
<head>
    <title>Clock</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            margin-top: 50px;
        }

        #digitalClock {
            font-size: 40px;
            display: none;
        }

        canvas {
            background: #f2f2f2;
            border-radius: 50%;
        }

        button {
            padding: 10px 20px;
            font-size: 18px;
            margin-bottom: 20px;
        }
        #analogClock {
    display: none;
}
    </style>
</head>

<body>

    <button onclick="toggleClock()">Press Button</button>

    <div id="digitalClock"></div>

    <canvas id="analogClock" width="200" height="200"></canvas>

<script>
/////////////////////////////////////////////////
// TOGGLE BUTTON + CONTROL INTERVALS
/////////////////////////////////////////////////

let isDigital = false;
let digitalInterval;
let analogInterval;

function toggleClock() {
    isDigital = !isDigital;

    let digital = document.getElementById("digitalClock");
    let analog = document.getElementById("analogClock");

    if (isDigital) {
        digital.style.display = "block";
        analog.style.display = "none";

        clearInterval(analogInterval);
        digitalInterval = setInterval(showDigitalClock, 1000);

    } else {
        digital.style.display = "none";
        analog.style.display = "block";

        clearInterval(digitalInterval);
        analogInterval = setInterval(drawClock, 1000);
    }
}

/////////////////////////////////////////////////
// DIGITAL CLOCK
/////////////////////////////////////////////////

function showDigitalClock() {
    let date = new Date();

    let h = date.getHours();
    let m = date.getMinutes();
    let s = date.getSeconds();

    h = h < 10 ? "0" + h : h;
    m = m < 10 ? "0" + m : m;
    s = s < 10 ? "0" + s : s;

    document.getElementById("digitalClock").innerText =
        h + ":" + m + ":" + s;
}

/////////////////////////////////////////////////
// ANALOG CLOCK
/////////////////////////////////////////////////

let canvas = document.getElementById("analogClock");
let ctx = canvas.getContext("2d");

let radius = canvas.height / 2;
ctx.translate(radius, radius);
radius = radius * 0.90;

function drawClock() {
    ctx.clearRect(-canvas.width/2, -canvas.height/2, canvas.width, canvas.height);

    drawFace();
    drawNumbers();
    drawTime();
}

function drawFace() {
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, 2 * Math.PI);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.stroke();
}

function drawNumbers() {
    ctx.font = radius * 0.15 + "px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (let num = 1; num <= 12; num++) {
        let angle = num * Math.PI / 6;

        let x = Math.cos(angle - Math.PI / 2) * radius * 0.8;
        let y = Math.sin(angle - Math.PI / 2) * radius * 0.8;

        ctx.fillText(num, x, y);
    }
}

function drawTime() {
    let now = new Date();

    let hour = now.getHours();
    let minute = now.getMinutes();
    let second = now.getSeconds();

    hour = hour % 12;
    hour = (hour * Math.PI / 6) +
           (minute * Math.PI / (6 * 60)) +
           (second * Math.PI / (360 * 60));
    drawHand(hour, radius * 0.5, 6);

    minute = (minute * Math.PI / 30) +
             (second * Math.PI / (30 * 60));
    drawHand(minute, radius * 0.8, 4);

    second = (second * Math.PI / 30);
    drawHand(second, radius * 0.9, 2);
}

function drawHand(pos, length, width) {
    ctx.beginPath();
    ctx.lineWidth = width;
    ctx.moveTo(0, 0);

    let x = Math.cos(pos - Math.PI / 2) * length;
    let y = Math.sin(pos - Math.PI / 2) * length;

    ctx.lineTo(x, y);
    ctx.stroke();
}

</script>

</body>
</html>
