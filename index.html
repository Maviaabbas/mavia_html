<!DOCTYPE html>
<html>
<head>
<title>Professional Clock</title>

<style>

body{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
font-family:Arial;
background:#f0f0f0;
}

h1{
margin-bottom:10px;
}

#clock{
width:320px;
height:320px;
border:8px solid black;
border-radius:50%;
position:relative;

background-image:url("");
background-size:cover;
background-position:center;
}

.number{
position:absolute;
font-size:20px;
font-weight:bold;
color:black;
transform:translate(-50%,-50%);
}

.hand{
position:absolute;
bottom:50%;
left:50%;
transform-origin:bottom;
transform:translateX(-50%);
}

#hour{
width:6px;
height:70px;
background:black;
border-radius:5px;
}

#minute{
width:4px;
height:100px;
background:black;
border-radius:5px;
}

#second{
width:2px;
height:120px;
background:red;
}

.center{
position:absolute;
width:14px;
height:14px;
background:black;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}

#digital{
font-size:40px;
margin-top:20px;
display:none;
}

select{
margin-top:20px;
padding:10px;
font-size:16px;
}

</style>
</head>

<body>

<h1>Professional Clock</h1>

<select onchange="changeClock(this.value)">
<option value="analog">Analog Clock</option>
<option value="digital">Digital Clock</option>
</select>

<div id="clock">

<div id="hour" class="hand"></div>
<div id="minute" class="hand"></div>
<div id="second" class="hand"></div>

<div class="center"></div>

</div>

<div id="digital"></div>


<script>

let clock = document.getElementById("clock");

/* AUTO CREATE NUMBERS */

for(let i=1;i<=12;i++){

let num = document.createElement("div");

num.className="number";

num.innerText=i;
 


//  360 ÷ 12 = 30°
let angle = i * 30;



// 320 ÷ 2 = 160px     // center point
// Thoda andar rakhne ke liye 130 use kiya
let radius = 130;




// /"Circle ke andar number ki horizontal position nikaalne ka formula"///
let x = 160 + radius * Math.sin(angle*Math.PI/180);



// "Circle ke andar number ki vertical position nikaalne ka formula"
let y = 160 - radius * Math.cos(angle*Math.PI/180);




num.style.left = x + "px";
num.style.top = y + "px";



// Ye number ko clock container ke andar HTML me add karta hai
clock.appendChild(num);

}

/* CLOCK FUNCTION */

function updateClock(){

let now = new Date();

let h = now.getHours();
let m = now.getMinutes();
let s = now.getSeconds();

document.getElementById("digital").innerHTML =
h + ":" + m + ":" + s;

let hDeg = (h % 12) * 30 + m * 0.5;           //   To 1 hour = 30°
 let mDeg = m * 6;                           //  To 1 minute = 6°
let sDeg = s * 6;                             //To 1 second = 6°

document.getElementById("hour").style.transform =
"translateX(-50%) rotate("+hDeg+"deg)";

document.getElementById("minute").style.transform =
"translateX(-50%) rotate("+mDeg+"deg)";

document.getElementById("second").style.transform =
"translateX(-50%) rotate("+sDeg+"deg)";

}

updateClock();
setInterval(updateClock,1000);                         //1000 → har 1000ms (1 second) ke baad ye function automatically call hoga//

/* SWITCH CLOCK */

function changeClock(type){

if(type=="digital"){
clock.style.display="none";
document.getElementById("digital").style.display="block";
}else{
clock.style.display="block";
document.getElementById("digital").style.display="none";
}

}

</script>

</body>
</html>
